<style>

.pn small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;line-height:1.2}

.hero p{color:var(--muted);max-width:560px}

.motw h3{font-size:calc(1.9rem*var(--ps))}.big{display:flex;gap:26px;flex-wrap:wrap}.big div b{display:block;direction:ltr;font-family:var(--fh);font-size:calc(2rem*var(--ps));color:var(--gold-2)}.big small{color:var(--muted)}
.tops{display:grid;gap:12px}.top{display:flex;align-items:center;gap:14px;padding:calc(16px*var(--ps)*var(--cs));background:color-mix(in srgb,var(--surface) calc(var(--opp)*1%),transparent)}.top:hover{transform:translateX(4px);border-color:var(--gold)}

.tw{overflow-x:auto;background:color-mix(in srgb,var(--surface) calc(var(--opt)*1%),transparent);padding:6px}

.bar{height:6px;min-width:90px;border-radius:9px;background:color-mix(in srgb,var(--gold) 12%,transparent);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}

if(first){document.querySelectorAll('#stats b').forEach(e=>{const v=+e.dataset.v,d=+e.dataset.d,s=e.dataset.s,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1400);e.textContent=(v*(1-Math.pow(1-p,3))).toLocaleString('en',{maximumFractionDigits:d})+s;if(p<1)requestAnimationFrame(f)})(t0)});first=false}
$('s1').textContent=L.s1;$('s1p').textContent=L.s1p;$('s2').textContent=L.s2;$('s2p').textContent=L.s2p;
const so=[...R].sort((a,b)=>b.hours-a.hours),mw=R.find(m=>m.name==S.site.motw)||so[0];
$('motw').innerHTML=mw?`<span class="badge">👑 ${esc(L.motw)}</span><div style="display:flex;align-items:center;gap:16px"><div class="av">${esc(ini(mw.name))}</div><div><h3>${esc(mw.name)}</h3><span class="chip ${isI(mw.rank)?'i':''}">${esc(mw.rank)}</span></div></div><div class="big"><div><b>${fm(mw.hours)}</b><small>${esc(L.cHours)}</small></div><div><b>${fm(mw.hours/(st.h||1)*100)}%</b><small>${esc(L.cShare)}</small></div></div>`:'';
$('tops').innerHTML=so.slice(0,3).map((m,i)=>`<div class="card top"><span class="md">${['🥇','🥈','🥉'][i]}</span><div class="av">${esc(ini(m.name))}</div><div><div class="nm">${esc(m.name)}</div><small>${esc(m.rank)}</small></div><div class="hv">${fm(m.hours)}<small>${esc(L.hrs)}</small></div></div>`).join('');
const rk=[...new Set(R.map(m=>m.rank))];
$('fr').innerHTML=`<option value="">${esc(L.allR)}</option>`+rk.map(x=>`<option ${x==FR?'selected':''}>${esc(x)}</option>`).join('');
$('fs').innerHTML=`<option value="">${esc(L.allS)}</option><option value="met" ${FS=='met'?'selected':''}>${esc(L.stMet)}</option><option value="below" ${FS=='below'?'selected':''}>${esc(L.stBelow)}</option>`;
$('ft1').innerHTML=`<div>${esc(L.foot)}</div><div>${esc(L.foot2)}</div>`;pres();tbl()}
function tbl(){const L=S.L;
const H=[['name',L.cName],['rank',L.cRank],['hours',L.cHours]];
$('th').innerHTML='<tr><th>#</th>'+H.map(h=>`<th onclick="srt('${h[0]}')">${esc(h[1])}${SK==h[0]?(SD>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
const key=m=>SK=='hours'?+m.hours:SK=='req'?(m.req==null?-1:+m.req):SK=='prog'?(m.req?+m.hours/+m.req:-1):String(m[SK]||'').toLowerCase();
const L2=S.roster.filter(m=>(!FR||m.rank==FR)&&(!FS||stt(m)==(FS=='met'?'g':'r'))&&(!Q||(m.name+' '+(m.player||'')).toLowerCase().includes(Q.toLowerCase()))).sort((a,b)=>{const x=key(a),y=key(b);return(x>y?1:x<y?-1:0)*SD});
$('tb').innerHTML=L2.map((m,i)=>`<tr><td class="num" style="color:var(--muted)">${i+1}</td><td><div class="pn"><div class="av">${esc(ini(m.name))}</div><div>${esc(m.name)}${m.player?`<small>${esc(m.player)}</small>`:''}</div></div></td><td><span class="chip ${isI(m.rank)?'i':''}">${esc(m.rank)}</span></td><td class="num ${stc(m)}">${fm(m.hours)}</td></tr>`).join('')}
function srt(k){SD=SK==k?-SD:-1;SK=k;tbl()}
let AQ='',PI=-1;
/* ===== presence box ===== */
function pkIdx(){const P=S.pres,n=P.slots.length;if(PI>=0&&PI<n)return PI;if(P.sel!=='peak'&&P.sel!==''&&+P.sel<n)return +P.sel;return P.slots.reduce((b,s,i,a)=>(+s.count||0)>(+a[b].count||0)?i:b,0)}
const avgP=()=>{const a=S.pres.slots,v=S.pres.avg;if(v!==''&&v!=null&&!isNaN(+v))return +v;return a.length?a.reduce((t,x)=>t+(+x.count||0),0)/a.length:0};
function pres(){const e=$('pavg');if(e)e.textContent=fm(avgP())}
const tmin=t=>{const m=String(t).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*([AaPp][Mm])?/);if(!m)return 1e4;let h=+m[1];const n=+(m[2]||0),ap=(m[3]||'').toLowerCase();if(ap=='pm'&&h<12)h+=12;if(ap=='am'&&h==12)h=0;return h*60+n};
css();render();
